services:
  postgres:
    image: postgres:16
    container_name: doggywood-postgres
    environment:
      POSTGRES_DB: doggywood
      POSTGRES_USER: doggywood
      POSTGRES_PASSWORD: doggywood_local_only
    ports:
      - "5432:5432"
    volumes:
      - doggywood_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doggywood -d doggywood"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  doggywood_pgdata:
